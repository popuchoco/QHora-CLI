[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrouter-cli"
version = "0.1.0"
description = "Read-only QuRouter CLI and MCP tools for QHora routers"
requires-python = ">=3.11"

[project.scripts]
qurouter = "qrouter_cli.cli:main"

[tool.setuptools.packages.find]
include = ["qrouter_cli*"]
